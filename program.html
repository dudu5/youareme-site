<!DOCTYPE html>
<html lang="en" style="background:#0a0a0a;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Program — You Are Me</title>
<link rel="icon" type="image/png" href="images/Logo/Logo-dark.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script async src="https://plausible.io/js/pa-ueYEguemb1yoTmQce6Gad.js"></script>
<style>
  .program-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .diagram {
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16/10;
  }

  /* Circles */
  .ring {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.5s ease;
  }

  .ring-meaning {
    width: 75%;
    aspect-ratio: 1;
    top: 50%;
    left: 1%;
    transform: translate(0, -50%);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .ring-meaning:hover {
    background: rgba(0,201,167,0.05);
    border-color: rgba(0,201,167,0.2);
    transform: translate(0, -50%) scale(1.02);
  }

  .ring-perspective {
    width: 52%;
    aspect-ratio: 1;
    top: 50%;
    left: 12%;
    transform: translate(0, -50%);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .ring-perspective:hover {
    background: rgba(0,201,167,0.06);
    border-color: rgba(0,201,167,0.25);
    transform: translate(0, -50%) scale(1.03);
  }

  .ring-body {
    width: 30%;
    aspect-ratio: 1;
    top: 50%;
    left: 23%;
    transform: translate(0, -50%);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .ring-body:hover {
    background: rgba(0,201,167,0.08);
    border-color: rgba(0,201,167,0.3);
    transform: translate(0, -50%) scale(1.04);
  }

  .ring-attention {
    width: 14%;
    aspect-ratio: 1;
    top: 50%;
    left: 31%;
    transform: translate(0, -50%);
    background: rgba(0,201,167,0.08);
    border: 1px solid rgba(0,201,167,0.2);
    animation: pulse-attention 4s ease-in-out infinite;
  }
  .ring-attention:hover {
    background: rgba(0,201,167,0.15);
    border-color: var(--accent);
    transform: translate(0, -50%) scale(1.05);
  }

  @keyframes pulse-attention {
    0%, 100% { border-color: rgba(0,201,167,0.2); }
    50% { border-color: rgba(0,201,167,0.35); }
  }

  /* Ring labels */

  .ring-label {
    position: absolute;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    color: var(--white);
    white-space: nowrap;
    pointer-events: none;
    text-align: center;
    line-height: 1.4;
    text-shadow: 0 0 15px rgba(0,255,204,0.3);
    transition: text-shadow 0.3s, transform 0.3s;
  }

  .ring-label-center {
    font-size: 16px;
    font-weight: 500;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    letter-spacing: 0.05em;
  }

  .ring:hover .ring-label { text-shadow: 0 0 30px rgba(0,255,204,0.5); transform: scale(1.15); }

  .ring-label-top {
    font-size: 13px;
    top: 10%;
    left: 50%;
    transform: translate(-50%, 0);
  }

  .ring-label-top-meaning {
    font-size: 13px;
    top: 4%;
    left: 50%;
    transform: translate(-50%, 0);
  }

  .ring-label-bottom {
    font-size: 13px;
    bottom: 12%;
    left: 50%;
    transform: translate(-50%, 0);
  }

  /* Right side elements */
  .side-label {
    position: absolute;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--dim);
    cursor: pointer;
    transition: all 0.3s;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid transparent;
  }

  .side-label:hover {
    color: var(--white);
    border-color: rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02);
    transform: translateX(-4px);
  }
  .side-label.active {
    color: var(--accent);
    border-color: rgba(0,201,167,0.2);
    background: rgba(0,201,167,0.04);
  }

  .side-label .arrow { color: var(--accent); margin-right: 4px; }

  .label-experimental {
    top: 38%;
    right: 12%;
  }

  .label-relational {
    top: 62%;
    right: 12%;
  }

  .label-pattern {
    top: 12%;
    right: 8%;
  }

  .label-friction {
    top: 80%;
    right: 8%;
    font-size: 14px;
    letter-spacing: 0.15em;
  }

  .label-acceptance {
    top: 80%;
    right: -2%;
    font-size: 14px;
  }

  .friction-arrow {
    position: absolute;
    top: 81%;
    right: 7%;
    color: var(--dimmer);
    font-size: 13px;
  }

  /* Connector lines */
  .connector {
    position: absolute;
    background: linear-gradient(to right, rgba(255,255,255,0.08), rgba(0,201,167,0.1));
    height: 1px;
  }

  .conn-experimental {
    width: 1px;
    height: 0;
    top: 42%;
    left: 56%;
    transform-origin: top left;
    transform: rotate(-5deg);
    width: 12%;
    height: 1px;
  }

  .conn-relational {
    top: 63%;
    left: 56%;
    width: 12%;
    height: 1px;
  }

  .conn-pattern {
    top: 14%;
    left: 52%;
    width: 18%;
    height: 1px;
  }

  /* Detail panel */
  .detail-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--dimmer);
    padding: 24px 32px;
    transform: translateY(100%);
    transition: transform 0.4s ease;
    z-index: 200;
    max-height: 50vh;
    overflow-y: auto;
  }

  .detail-panel.open { transform: translateY(0); }

  .detail-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 300;
    color: var(--white);
    margin-bottom: 8px;
  }

  .detail-desc {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--dim);
    line-height: 1.7;
    margin-bottom: 12px;
  }

  .detail-link {
    font-size: 13px;
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 0.5px;
    text-underline-offset: 4px;
  }

  .detail-close {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 20px;
    color: var(--dim);
    cursor: pointer;
    background: none;
    border: none;
  }

  @media (max-width: 768px) {
    .diagram { aspect-ratio: 1; }
    .label, .side-label { font-size: 12px; }
    .ring-meaning { width: 70%; left: 5%; }
    .ring-perspective { width: 52%; left: 14%; }
    .ring-body { width: 34%; left: 23%; }
    .ring-attention { width: 18%; left: 31%; }
    .label-attention { left: 31%; transform: translate(calc(9vw - 50%), -50%); }
    .label-body { left: 25%; top: 70%; }
    .label-perspective { left: 16%; top: 24%; }
    .label-meaning { left: 8%; top: 10%; }
    .label-meaning-sub { left: 8%; top: 14%; }
    .label-experimental { right: 2%; top: 35%; }
    .label-relational { right: 2%; top: 65%; }
    .label-pattern { right: 2%; top: 8%; }
    .label-friction { right: 2%; top: 82%; }
    .friction-arrow { right: 1%; }
    .label-acceptance { right: -8%; }
    .conn-experimental { left: 58%; width: 15%; }
    .conn-relational { left: 58%; width: 15%; }
    .conn-pattern { left: 55%; width: 20%; }
  }
</style>
</head>
<body>

<div class="bg-fixed"></div>


<div class="program-wrap">
  <div class="diagram">
    <!-- Rings with labels inside -->
    <div class="ring ring-meaning" onclick="showDetail('meaning')">
      <span class="ring-label ring-label-top-meaning">Meaning-making<br><span style="font-size:0.85em; opacity:0.6;">(the larger why)</span></span>
    </div>
    <div class="ring ring-perspective" onclick="showDetail('perspective')">
      <span class="ring-label ring-label-top">Perspective flexibility</span>
    </div>
    <div class="ring ring-body" onclick="showDetail('body')">
      <span class="ring-label ring-label-bottom">Body</span>
    </div>
    <div class="ring ring-attention" onclick="showDetail('attention')">
      <span class="ring-label ring-label-center">Attention</span>
    </div>

    <!-- Connectors -->
    <div class="connector conn-experimental"></div>
    <div class="connector conn-relational"></div>
    <div class="connector conn-pattern"></div>

    <!-- Right side labels -->
    <div class="side-label label-experimental" onclick="showDetail('experimental')"><span class="arrow">→</span> Experimental practice</div>
    <div class="side-label label-relational" onclick="showDetail('relational')"><span class="arrow">→</span> Relational contact</div>
    <div class="side-label label-pattern" onclick="showDetail('pattern')">Pattern awareness</div>

    <!-- Friction → Acceptance -->
    <div class="side-label label-friction" onclick="showDetail('friction')">F R I C T I O N</div>
    <div class="friction-arrow">→</div>
    <div class="side-label label-acceptance" onclick="showDetail('acceptance')">Acceptance</div>
  </div>
</div>

<!-- Detail panel -->
<div class="detail-panel" id="detailPanel">
  <button class="detail-close" onclick="closeDetail()">✕</button>
  <div class="detail-title" id="detailTitle"></div>
  <div class="detail-desc" id="detailDesc"></div>
  <a class="detail-link" id="detailLink" href="#" style="display:none;"></a>
</div>

<script>
window.skipToolbar = true;
// Force service worker to update
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(r) { r.update(); });
  });
}
</script>
<script src="shared.js"></script>
<script src="menu.js"></script>
<script>
var details = {
  attention: {
    title: 'Attention',
    desc: 'The center of everything. Where your focus goes, energy follows. Before you can change anything, you need to notice where your attention actually lives — not where you think it should be.',
    link: 'test-meta',
    linkText: '→ Take the Meta-Observation test'
  },
  body: {
    title: 'Body',
    desc: 'Your body holds what your mind avoids. Tension, shutdown, restlessness — these aren\'t problems. They\'re information. Learning to read your body is learning to read the truth of your situation.',
    link: 'yourmap',
    linkText: '→ Explore your map'
  },
  perspective: {
    title: 'Perspective Flexibility',
    desc: 'Can you see the same situation from a different angle? Rigidity keeps you stuck. Flexibility creates options. This isn\'t about being "open-minded" — it\'s about being able to genuinely occupy a perspective that isn\'t your default.',
    link: '/',
    linkText: '→ Read perspectives'
  },
  meaning: {
    title: 'Meaning-Making',
    desc: 'The story you tell about why things happen. This is the outermost layer — the narrative that either traps you or frees you. When you can see that your meaning is constructed, you can begin to construct differently.',
    link: null,
    linkText: ''
  },
  experimental: {
    title: 'Experimental Practice',
    desc: 'Change doesn\'t come from understanding. It comes from trying something different and surviving it. Small experiments — doing one thing you normally avoid, saying one thing you normally suppress — build the evidence your system needs.',
    link: null,
    linkText: ''
  },
  relational: {
    title: 'Relational Contact',
    desc: 'You can\'t see your own patterns alone. Another person — awake, present, honest — becomes a mirror. Not to fix you. To witness you. That witnessing changes what\'s possible.',
    link: 'collaborate',
    linkText: '→ Work with me'
  },
  pattern: {
    title: 'Pattern Awareness',
    desc: 'The ability to see your own loops as they\'re running. Not after. Not in theory. In real time. This is the skill that makes everything else possible.',
    link: 'awareness',
    linkText: '→ Presence & Intention'
  },
  friction: {
    title: 'Friction',
    desc: 'The resistance you feel when change gets real. Your system pushes back — not because you\'re doing it wrong, but because you\'re threatening what kept you safe. Friction isn\'t the enemy. It\'s the signal that you\'re at the edge of growth.',
    link: null,
    linkText: ''
  },
  acceptance: {
    title: 'Acceptance',
    desc: 'Not giving up. Not settling. Seeing what is — fully, without needing it to be different — so you can choose from clarity instead of reactivity. Acceptance is the ground that makes real change possible.',
    link: null,
    linkText: ''
  }
};

function showDetail(key) {
  var d = details[key];
  document.getElementById('detailTitle').textContent = d.title;
  document.getElementById('detailDesc').textContent = d.desc;
  var link = document.getElementById('detailLink');
  if (d.link) {
    link.href = d.link;
    link.textContent = d.linkText;
    link.style.display = '';
  } else {
    link.style.display = 'none';
  }
  document.getElementById('detailPanel').classList.add('open');

  // Highlight active
  document.querySelectorAll('.label, .side-label').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.ring').forEach(function(el) { el.style.borderColor = ''; el.style.background = ''; });
  var labels = document.querySelectorAll('.label-' + key + ', .label-' + key + '-sub');
  labels.forEach(function(el) { el.classList.add('active'); });
  var ring = document.querySelector('.ring-' + key);
  if (ring) { ring.style.borderColor = 'var(--accent)'; ring.style.background = 'rgba(0,201,167,0.04)'; }
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  document.querySelectorAll('.label, .side-label').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.ring').forEach(function(el) { el.style.borderColor = ''; el.style.background = ''; });
}

// ── COLOR RANDOMIZER ──
var diagramThemes = [
  { bg: '#0a0a0a', text: '#ffffff', ring: '#00ffcc', ringBg: ['#00ffcc22','#00ffcc2a','#00ffcc35','#00ffcc50'], border: ['#00ffcc44','#00ffcc66','#00ffcc88','#00ffccbb'] },
  { bg: '#0c0018', text: '#e8d0ff', ring: '#bf5fff', ringBg: ['#bf5fff1a','#bf5fff28','#bf5fff38','#bf5fff55'], border: ['#bf5fff40','#bf5fff60','#bf5fff88','#bf5fffbb'] },
  { bg: '#001a1a', text: '#a0fff0', ring: '#ff6b6b', ringBg: ['#ff6b6b1a','#ff6b6b28','#ff6b6b38','#ff6b6b55'], border: ['#ff6b6b40','#ff6b6b60','#ff6b6b88','#ff6b6bbb'] },
  { bg: '#1a1000', text: '#ffe8a0', ring: '#ffaa00', ringBg: ['#ffaa001a','#ffaa0028','#ffaa0038','#ffaa0055'], border: ['#ffaa0040','#ffaa0060','#ffaa0088','#ffaa00bb'] },
  { bg: '#000a1a', text: '#c0e8ff', ring: '#4da6ff', ringBg: ['#4da6ff1a','#4da6ff28','#4da6ff38','#4da6ff55'], border: ['#4da6ff40','#4da6ff60','#4da6ff88','#4da6ffbb'] },
];
var currentDiagramColor = 0;

function randomizeDiagramColor() {
  var t = diagramThemes[currentDiagramColor];
  var c = t.ring;

  // Background
  document.body.style.background = t.bg;
  document.querySelector('.bg-fixed').style.background = t.bg;

  // Ring fills and borders — each ring gets stronger toward center
  var rings = ['meaning','perspective','body','attention'];
  rings.forEach(function(name, i) {
    var ring = document.querySelector('.ring-' + name);
    ring.style.background = t.ringBg[i];
    ring.style.borderColor = t.border[i];
    ring.style.boxShadow = '0 0 ' + (20 + i*10) + 'px ' + c + (10 + i*8).toString(16).padStart(2,'0') + ' inset';
  });

  // Text — bright and popping
  document.querySelectorAll('.ring-label').forEach(function(el) {
    el.style.color = t.text;
    el.style.textShadow = '0 0 20px ' + c + '40';
  });
  document.querySelectorAll('.side-label').forEach(function(el) {
    el.style.color = t.text;
  });

  // Connectors
  document.querySelectorAll('.connector').forEach(function(el) {
    el.style.background = 'linear-gradient(to right, ' + c + '20, ' + c + '60)';
  });

  // Arrows
  document.querySelectorAll('.arrow').forEach(function(el) { el.style.color = c; });

  // Detail panel
  document.querySelector('.detail-panel').style.background = t.bg;
  document.querySelector('.detail-panel').style.borderColor = c + '44';
  document.querySelector('.detail-title').style.color = c;

  // Nav arrows
  prevBtn.style.color = c;
  prevBtn.style.borderColor = c + '60';
  nextBtn.style.color = c;
  nextBtn.style.borderColor = c + '60';
}

function prevTheme() {
  currentDiagramColor = (currentDiagramColor - 1 + diagramThemes.length) % diagramThemes.length;
  applyDiagramTheme();
}

function nextTheme() {
  currentDiagramColor = (currentDiagramColor + 1) % diagramThemes.length;
  applyDiagramTheme();
}

function applyDiagramTheme() {
  randomizeDiagramColor();
}

// Nav arrows
var navWrap = document.createElement('div');
navWrap.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:100; display:flex; gap:16px;';

var prevBtn = document.createElement('button');
prevBtn.textContent = '←';
prevBtn.style.cssText = 'width:48px; height:48px; border-radius:50%; border:1px solid var(--accent); background:none; color:var(--accent); font-size:22px; cursor:pointer; transition:all 0.2s;';
prevBtn.onclick = prevTheme;

var nextBtn = document.createElement('button');
nextBtn.textContent = '→';
nextBtn.style.cssText = 'width:48px; height:48px; border-radius:50%; border:1px solid var(--accent); background:none; color:var(--accent); font-size:22px; cursor:pointer; transition:all 0.2s;';
nextBtn.onclick = nextTheme;

navWrap.appendChild(prevBtn);
navWrap.appendChild(nextBtn);
document.body.appendChild(navWrap);
</script>
</body>
</html>
