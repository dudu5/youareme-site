<html lang="en" style="background:#050508;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="images/Logo/Logo-dark.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script async src="https://plausible.io/js/pa-ueYEguemb1yoTmQce6Gad.js"></script>
<style>
  /* ── BACKGROUND: depth through lighting ── */
  .program-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: radial-gradient(ellipse at 30% 50%, rgba(31,232,195,0.04) 0%, transparent 60%);
  }

  .diagram {
    position: relative;
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 16/10;
  }

  /* ── RINGS: living gravitational fields ── */
  .ring {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Outer — meaning */
  .ring-meaning {
    width: 75%;
    aspect-ratio: 1;
    top: 50%;
    left: -8%;
    transform: translate(0, -50%);
    background: none;
    border: 2px solid rgba(31,232,195,0.5);
    animation: none;
  }
  .ring-meaning:hover {
    border-color: rgba(255,255,255,0.12);
    box-shadow: 0 0 80px rgba(31,232,195,0.03) inset;
    transform: translate(0, -50%) scale(1.01);
  }

  /* Perspective */
  .ring-perspective {
    width: 52%;
    aspect-ratio: 1;
    top: 50%;
    left: 3%;
    transform: translate(0, -50%);
    background: none;
    border: 2px solid rgba(31,232,195,0.5);
    animation: none;
  }
  .ring-perspective:hover {
    border-color: rgba(255,255,255,0.15);
    box-shadow: 0 0 60px rgba(31,232,195,0.04) inset;
    transform: translate(0, -50%) scale(1.015);
  }

  /* Body — the field */
  .ring-body {
    width: 30%;
    aspect-ratio: 1;
    top: 50%;
    left: 14%;
    transform: translate(0, -50%);
    background: radial-gradient(circle at center, rgba(31,232,195,0.06) 0%, rgba(31,232,195,0.02) 70%, transparent 100%);
    border: 2px solid rgba(31,232,195,0.5);
    box-shadow: 0 0 40px rgba(31,232,195,0.05) inset;
    animation: none;
  }
  .ring-body:hover {
    border-color: rgba(31,232,195,0.3);
    box-shadow: 0 0 60px rgba(31,232,195,0.08) inset, 0 0 30px rgba(31,232,195,0.04);
    transform: translate(0, -50%) scale(1.02);
  }

  /* Attention — the energy core */
  .ring-attention {
    width: 14%;
    aspect-ratio: 1;
    top: 50%;
    left: 22%;
    transform: translate(0, -50%);
    background: radial-gradient(circle at center, rgba(31,232,195,0.15) 0%, rgba(31,232,195,0.05) 60%, transparent 100%);
    border: 2px solid rgba(31,232,195,0.5);
    box-shadow: 0 0 30px rgba(31,232,195,0.08) inset, 0 0 60px rgba(31,232,195,0.03);
    animation: pulse-core 4s ease-in-out infinite;
    backdrop-filter: blur(2px);
  }
  .ring-attention:hover {
    border-color: rgba(31,232,195,0.5);
    box-shadow: 0 0 40px rgba(31,232,195,0.15) inset, 0 0 80px rgba(31,232,195,0.06);
    transform: translate(0, -50%) scale(1.05);
  }

  /* ── BREATHING ANIMATIONS ── */
  @keyframes pulse-core {
    0%, 100% { box-shadow: 0 0 30px rgba(31,232,195,0.08) inset, 0 0 60px rgba(31,232,195,0.03); }
    50% { box-shadow: 0 0 40px rgba(31,232,195,0.12) inset, 0 0 80px rgba(31,232,195,0.05); }
  }
  @keyframes breathe-inner {
    0%, 100% { border-color: rgba(31,232,195,0.15); }
    50% { border-color: rgba(31,232,195,0.2); }
  }
  @keyframes breathe-mid {
    0%, 100% { border-color: rgba(255,255,255,0.12); }
    50% { border-color: rgba(255,255,255,0.18); }
  }
  @keyframes breathe-outer {
    0%, 100% { border-color: rgba(255,255,255,0.1); }
    50% { border-color: rgba(255,255,255,0.15); }
  }

  /* ── TYPOGRAPHY: clear hierarchy ── */
  .ring-label {
    position: absolute;
    font-family: 'DM Sans', sans-serif;
    color: var(--white);
    white-space: nowrap;
    pointer-events: none;
    text-align: center;
    line-height: 1.4;
    transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    opacity: 0;
    animation: label-in 1.2s ease forwards;
  }

  .ring-label-center {
    font-size: 22px;
    font-weight: 600;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    letter-spacing: 0.08em;
    text-shadow: 0 0 30px rgba(31,232,195,0.4);
    animation-delay: 0.2s;
  }

  .ring-label-bottom {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.03em;
    bottom: 12%;
    left: 50%;
    transform: translate(-50%, 0);
    animation-delay: 0.4s;
  }

  .ring-label-top {
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.03em;
    top: 10%;
    left: 50%;
    transform: translate(-50%, 0);
    opacity: 0.85;
    animation-delay: 0.6s;
  }

  .ring-label-top-meaning {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.03em;
    top: 4%;
    left: 50%;
    transform: translate(-50%, 0);
    opacity: 0.7;
    animation-delay: 0.8s;
  }

  .ring:hover .ring-label {
    text-shadow: 0 0 40px rgba(31,232,195,0.5);
    filter: brightness(1.2);
  }

  @keyframes label-in {
    from { opacity: 0; filter: blur(4px); }
    to { opacity: 1; filter: blur(0); }
  }

  /* ── RIGHT SIDE: cycle ── */
  .cycle-wrap {
    position: absolute;
    right: -5%;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 22%;
    opacity: 0;
    animation: label-in 1.5s ease 1s forwards;
  }

  .cycle-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    text-align: center;
  }

  .cycle-label:hover { color: var(--white); text-shadow: 0 0 20px rgba(255,255,255,0.15); }

  .cycle-friction {
    font-size: 14px;
    letter-spacing: 0.2em;
    font-weight: 500;
    text-transform: uppercase;
  }

  .cycle-acceptance {
    font-size: 15px;
    font-weight: 400;
  }

  .cycle-arrow-up {
    font-size: 14px;
    color: rgba(31,232,195,0.3);
    line-height: 1;
  }

  .cycle-circle {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    gap: 16px;
    padding: 12px 0;
    color: var(--dim);
  }

  .cycle-inner-label {
    position: relative;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    text-align: center;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    line-height: 1.3;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 10px 20px;
    width: 180px;
    backdrop-filter: blur(1px);
  }

  .cycle-inner-label:hover {
    color: var(--white);
    border-color: rgba(31,232,195,0.2);
    box-shadow: 0 0 20px rgba(31,232,195,0.05);
    transform: translateX(-4px);
  }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(5,5,5,0.95);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 32px 40px;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 200;
    max-height: 50vh;
    overflow-y: auto;
    backdrop-filter: blur(20px);
  }

  .detail-panel.open { transform: translateY(0); }

  .detail-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    color: var(--white);
    margin-bottom: 12px;
  }

  .detail-desc {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: rgba(255,255,255,0.6);
    line-height: 1.8;
    margin-bottom: 16px;
    max-width: 600px;
  }

  .detail-link {
    font-size: 14px;
    color: rgba(31,232,195,0.8);
    text-decoration: underline;
    text-decoration-thickness: 0.5px;
    text-underline-offset: 4px;
  }

  .detail-close {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 20px;
    color: var(--dim);
    cursor: pointer;
    background: none;
    border: none;
  }

  @media (max-width: 768px) {
    .diagram { aspect-ratio: 1; }
    .label, .side-label { font-size: 12px; }
    .ring-meaning { width: 70%; left: 5%; }
    .ring-perspective { width: 52%; left: 14%; }
    .ring-body { width: 34%; left: 23%; }
    .ring-attention { width: 18%; left: 31%; }
    .label-attention { left: 31%; transform: translate(calc(9vw - 50%), -50%); }
    .label-body { left: 25%; top: 70%; }
    .label-perspective { left: 16%; top: 24%; }
    .label-meaning { left: 8%; top: 10%; }
    .label-meaning-sub { left: 8%; top: 14%; }
    .cycle-wrap { width: 40%; right: 0; }
  }
</style>
</head>
<body>

<div class="bg-fixed"></div>


<div class="program-wrap">
  <div class="diagram">
    <!-- Rings with labels inside -->
    <div class="ring ring-meaning" onclick="showDetail('meaning')">
      <span class="ring-label ring-label-top-meaning">Meaning-making<br><span style="font-size:0.85em; opacity:0.6;">(the larger why)</span></span>
    </div>
    <div class="ring ring-perspective" onclick="showDetail('perspective')">
      <span class="ring-label ring-label-top">Perspective flexibility</span>
    </div>
    <div class="ring ring-body" onclick="showDetail('body')">
      <span class="ring-label ring-label-bottom">Body</span>
    </div>
    <div class="ring ring-attention" onclick="showDetail('attention')">
      <span class="ring-label ring-label-center">Attention</span>
    </div>

    <!-- Right side: cycle diagram -->
    <div class="cycle-wrap">
      <div class="cycle-label cycle-acceptance" onclick="showDetail('acceptance')" style="font-size:24px; font-weight:500;">ACCEPTANCE</div>
      <div class="cycle-arrow-up" style="font-size:14px; color:var(--dimmer);">↑</div>
      <div class="cycle-label cycle-friction" onclick="showDetail('friction')" style="font-size:20px;">FRICTION</div>
      <div class="cycle-arrow-up" style="font-size:14px; color:var(--dimmer);">↑</div>

      <div class="cycle-circle" style="position:relative;">

        <div class="cycle-inner-label cycle-experimental" onclick="showDetail('experimental')">Experimental practice</div>
        <div class="cycle-inner-label cycle-relational" onclick="showDetail('relational')">Relational contact</div>
        <div class="cycle-inner-label cycle-pattern" onclick="showDetail('pattern')">Pattern awareness</div>

        <!-- Rectangular flow arrows -->
        <svg class="cycle-arrow-svg" viewBox="0 0 240 220" preserveAspectRatio="none" style="position:absolute; left:-25px; top:0; width:calc(100% + 50px); height:100%; overflow:visible; z-index:-1;">
          <!-- Left side: top to bottom -->
          <path d="M 10 30 L 10 190" fill="none" stroke-width="1"/>
          <!-- Bottom connector: left to label -->
          <path d="M 10 190 L 30 190" fill="none" stroke-width="1"/>
          <!-- Arrow pointing right into Pattern -->
          <path d="M 25 185 L 33 190 L 25 195" fill="none" stroke-width="1"/>

          <!-- Right side: bottom to top -->
          <path d="M 230 190 L 230 30" fill="none" stroke-width="1"/>
          <!-- Top connector: right to label -->
          <path d="M 230 30 L 210 30" fill="none" stroke-width="1"/>
          <!-- Arrow pointing left into Experimental -->
          <path d="M 215 25 L 207 30 L 215 35" fill="none" stroke-width="1"/>
        </svg>
      </div>
    </div>

  </div>
</div>

<!-- Detail panel -->
<div class="detail-panel" id="detailPanel">
  <button class="detail-close" onclick="closeDetail()">✕</button>
  <div class="detail-title" id="detailTitle"></div>
  <div class="detail-desc" id="detailDesc"></div>
  <a class="detail-link" id="detailLink" href="#" style="display:none;"></a>
</div>

<script>
window.skipToolbar = true;
window.skipTheme = true;
// Unregister service worker for this page to prevent caching issues
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(r) { r.unregister(); });
  });
  caches.keys().then(function(names) {
    names.forEach(function(name) { caches.delete(name); });
  });
}
</script>
<script src="shared.js"></script>

<script>
var details = {
  attention: {
    title: 'Attention',
    desc: 'The center of everything. Where your focus goes, energy follows. Before you can change anything, you need to notice where your attention actually lives — not where you think it should be.',
    link: 'test-meta',
    linkText: '→ Take the Meta-Observation test'
  },
  body: {
    title: 'Body',
    desc: 'Your body holds what your mind avoids. Tension, shutdown, restlessness — these aren\'t problems. They\'re information. Learning to read your body is learning to read the truth of your situation.',
    link: 'yourmap',
    linkText: '→ Explore your map'
  },
  perspective: {
    title: 'Perspective Flexibility',
    desc: 'Can you see the same situation from a different angle? Rigidity keeps you stuck. Flexibility creates options. This isn\'t about being "open-minded" — it\'s about being able to genuinely occupy a perspective that isn\'t your default.',
    link: '/',
    linkText: '→ Read perspectives'
  },
  meaning: {
    title: 'Meaning-Making',
    desc: 'The story you tell about why things happen. This is the outermost layer — the narrative that either traps you or frees you. When you can see that your meaning is constructed, you can begin to construct differently.',
    link: null,
    linkText: ''
  },
  experimental: {
    title: 'Experimental Practice',
    desc: 'Change doesn\'t come from understanding. It comes from trying something different and surviving it. Small experiments — doing one thing you normally avoid, saying one thing you normally suppress — build the evidence your system needs.',
    link: null,
    linkText: ''
  },
  relational: {
    title: 'Relational Contact',
    desc: 'You can\'t see your own patterns alone. Another person — awake, present, honest — becomes a mirror. Not to fix you. To witness you. That witnessing changes what\'s possible.',
    link: 'collaborate',
    linkText: '→ Work with me'
  },
  pattern: {
    title: 'Pattern Awareness',
    desc: 'The ability to see your own loops as they\'re running. Not after. Not in theory. In real time. This is the skill that makes everything else possible.',
    link: 'awareness',
    linkText: '→ Presence & Intention'
  },
  friction: {
    title: 'Friction',
    desc: 'The resistance you feel when change gets real. Your system pushes back — not because you\'re doing it wrong, but because you\'re threatening what kept you safe. Friction isn\'t the enemy. It\'s the signal that you\'re at the edge of growth.',
    link: null,
    linkText: ''
  },
  acceptance: {
    title: 'Acceptance',
    desc: 'Not giving up. Not settling. Seeing what is — fully, without needing it to be different — so you can choose from clarity instead of reactivity. Acceptance is the ground that makes real change possible.',
    link: null,
    linkText: ''
  }
};

function showDetail(key) {
  window.location.href = 'dimension?d=' + key;
  return;
  // Legacy detail panel code below
  var d = details[key];
  document.getElementById('detailTitle').textContent = d.title;
  document.getElementById('detailDesc').textContent = d.desc;
  var link = document.getElementById('detailLink');
  if (d.link) {
    link.href = d.link;
    link.textContent = d.linkText;
    link.style.display = '';
  } else {
    link.style.display = 'none';
  }
  document.getElementById('detailPanel').classList.add('open');

  // Highlight active
  document.querySelectorAll('.label, .side-label').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.ring').forEach(function(el) { el.style.borderColor = ''; el.style.background = ''; });
  var labels = document.querySelectorAll('.label-' + key + ', .label-' + key + '-sub');
  labels.forEach(function(el) { el.classList.add('active'); });
  var ring = document.querySelector('.ring-' + key);
  if (ring) { ring.style.borderColor = 'var(--accent)'; ring.style.background = 'rgba(0,201,167,0.04)'; }
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  document.querySelectorAll('.label, .side-label').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.ring').forEach(function(el) { el.style.borderColor = ''; el.style.background = ''; });
}

// ── COLOR RANDOMIZER ──
var diagramThemes = [
  // Dark black — neon teal
  { bg: '#0a0a0a', text: '#ffffff', ring: '#00ffcc', ringBg: ['none','none','none','#00ffcc18'], border: ['#00ffcc25','#00ffcc35','#00ffcc','#00ffcc'] },
  // Warm cream — deep burgundy
  { bg: '#f5f0e6', text: '#2a1520', ring: '#8c1c4a', ringBg: ['none','none','none','#8c1c4a28'], border: ['#8c1c4a25','#8c1c4a35','#8c1c4a','#8c1c4a'] },
  // Deep navy — electric coral
  { bg: '#0d1b2a', text: '#e0f0ff', ring: '#ff6b6b', ringBg: ['none','none','none','#ff6b6b30'], border: ['#ff6b6b25','#ff6b6b35','#ff6b6b','#ff6b6b'] },
  // Sage green — warm amber
  { bg: '#e8ede4', text: '#1a2818', ring: '#c47d15', ringBg: ['none','none','none','#c47d1528'], border: ['#c47d1525','#c47d1535','#c47d15','#c47d15'] },
  // Midnight purple — gold
  { bg: '#12081f', text: '#f0e8d0', ring: '#ffc640', ringBg: ['none','none','none','#ffc64030'], border: ['#ffc64025','#ffc64035','#ffc640','#ffc640'] },
];
var currentDiagramColor = parseInt(localStorage.getItem('yam_program_theme') || '0');

function randomizeDiagramColor() {
  var t = diagramThemes[currentDiagramColor];
  var c = t.ring;

  // Background
  document.body.style.background = t.bg;
  document.querySelector('.bg-fixed').style.background = t.bg;

  // CSS vars for borders
  var r = document.documentElement;
  r.style.setProperty('--ring-border-outer', t.border[0]);
  r.style.setProperty('--ring-border-mid', t.border[1]);
  r.style.setProperty('--ring-hover', c + '15');

  // Rings
  var rings = ['meaning','perspective','attention','body'];
  rings.forEach(function(name, i) {
    var ring = document.querySelector('.ring-' + name);
    ring.style.background = t.ringBg[i];
    ring.style.setProperty('border-color', t.border[i], 'important');
    ring.style.boxShadow = i === 3 ? '0 0 30px ' + c + '20 inset' : 'none';
  });

  // All text — theme colored
  document.querySelectorAll('.ring-label').forEach(function(el) {
    el.style.color = t.text;
    el.style.textShadow = '0 0 20px ' + c + '40';
  });
  document.querySelectorAll('.cycle-label, .cycle-inner-label').forEach(function(el) {
    el.style.color = t.text;
    el.style.borderColor = t.border[1];
  });
  document.querySelectorAll('.cycle-arrow-up').forEach(function(el) {
    el.style.color = c;
  });
  document.querySelectorAll('.arrow').forEach(function(el) { el.style.color = c; });

  // Cycle arrow SVG
  document.querySelectorAll('.cycle-arrow-svg path').forEach(function(el) { el.setAttribute('stroke', c); });

  // Detail panel
  document.querySelector('.detail-panel').style.background = t.bg;
  document.querySelector('.detail-panel').style.borderColor = c + '44';
  document.querySelector('.detail-title').style.color = c;

  // Font button
  fontBtn.style.borderColor = c + '50';
  fontBtn.style.color = t.text;

}

function prevTheme() {
  currentDiagramColor = (currentDiagramColor - 1 + diagramThemes.length) % diagramThemes.length;
  applyDiagramTheme();
}

function nextTheme() {
  currentDiagramColor = (currentDiagramColor + 1) % diagramThemes.length;
  applyDiagramTheme();
}

function applyDiagramTheme() {
  localStorage.setItem('yam_program_theme', currentDiagramColor);
  randomizeDiagramColor();
}


// Color palette toggle
var paletteBtn = document.createElement('button');
paletteBtn.textContent = '🎨';
paletteBtn.style.cssText = 'position:fixed; left:20px; top:50%; transform:translateY(-50%); z-index:101; width:44px; height:44px; border-radius:50%; border:1px solid var(--dimmer); background:none; font-size:22px; cursor:pointer; transition:all 0.2s;';
paletteBtn.onmouseenter = function() { this.style.transform = 'translateY(-50%) scale(1.1)'; };
paletteBtn.onmouseleave = function() { this.style.transform = 'translateY(-50%)'; };
document.body.appendChild(paletteBtn);

var palette = document.createElement('div');
palette.style.cssText = 'position:fixed; left:20px; top:50%; transform:translateY(-50%); z-index:100; display:none; flex-direction:column; gap:8px; padding:12px; background:rgba(0,0,0,0.6); border-radius:24px; backdrop-filter:blur(8px);';

diagramThemes.forEach(function(t, i) {
  var swatch = document.createElement('button');
  swatch.style.cssText = 'width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:all 0.2s; background:' + t.ring + '; box-shadow:0 0 8px ' + t.ring + '40;';
  if (i === 0) swatch.style.borderColor = '#fff';
  swatch.onclick = function(e) {
    e.stopPropagation();
    currentDiagramColor = i;
    applyDiagramTheme();
    palette.querySelectorAll('button').forEach(function(b) { b.style.borderColor = 'transparent'; });
    swatch.style.borderColor = '#fff';
  };
  swatch.onmouseenter = function() { this.style.transform = 'scale(1.2)'; };
  swatch.onmouseleave = function() { this.style.transform = 'scale(1)'; };
  palette.appendChild(swatch);
});

// Font randomizer
var fonts = [
  "'DM Sans', sans-serif",
  "'Cormorant Garamond', serif",
  "'Georgia', serif",
  "'Courier New', monospace",
  "'Helvetica Neue', sans-serif",
];
var currentFont = 0;
var fontBtn = document.createElement('button');
fontBtn.textContent = 'Aa';
fontBtn.style.cssText = 'width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); background:none; color:rgba(255,255,255,0.7); font-size:13px; cursor:pointer; transition:all 0.2s; font-family:serif;';
fontBtn.onmouseenter = function() { this.style.transform = 'scale(1.2)'; };
fontBtn.onmouseleave = function() { this.style.transform = 'scale(1)'; };
fontBtn.onclick = function(e) {
  e.stopPropagation();
  currentFont = (currentFont + 1) % fonts.length;
  document.querySelectorAll('.ring-label').forEach(function(el) {
    el.style.fontFamily = fonts[currentFont];
  });
  document.querySelectorAll('.side-label').forEach(function(el) {
    el.style.fontFamily = fonts[currentFont];
  });
};
palette.appendChild(fontBtn);

document.body.appendChild(palette);

paletteBtn.onclick = function(e) {
  e.stopPropagation();
  var isOpen = palette.style.display === 'flex';
  palette.style.display = isOpen ? 'none' : 'flex';
  paletteBtn.style.display = isOpen ? '' : 'none';
};

document.addEventListener('click', function() {
  palette.style.display = 'none';
  paletteBtn.style.display = '';
});

// Apply saved theme on load
applyDiagramTheme();
// Highlight active swatch
var swatches = palette.querySelectorAll('button:not(:last-child)');
if (swatches[currentDiagramColor]) swatches[currentDiagramColor].style.borderColor = '#fff';
</script>
</body>
</html>
