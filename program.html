<!DOCTYPE html>
<html lang="en" style="background:#0a0a0a;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Program — You Are Me</title>
<link rel="icon" type="image/png" href="images/Logo/Logo-dark.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script async src="https://plausible.io/js/pa-ueYEguemb1yoTmQce6Gad.js"></script>
<style>
  .program-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .diagram {
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16/10;
  }

  /* Circles */
  .ring {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.5s ease;
  }

  .ring-meaning {
    width: 75%;
    aspect-ratio: 1;
    top: 50%;
    left: -22%;
    transform: translate(0, -50%);
    background: none;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .ring-meaning:hover {
    background: rgba(0,201,167,0.03);
    border-color: rgba(0,201,167,0.2);
    transform: translate(0, -50%) scale(1.02);
  }

  .ring-perspective {
    width: 52%;
    aspect-ratio: 1;
    top: 50%;
    left: -11%;
    transform: translate(0, -50%);
    background: none;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .ring-perspective:hover {
    background: rgba(0,201,167,0.04);
    border-color: rgba(0,201,167,0.25);
    transform: translate(0, -50%) scale(1.03);
  }

  .ring-body {
    width: 30%;
    aspect-ratio: 1;
    top: 50%;
    left: 0%;
    transform: translate(0, -50%);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .ring-body:hover {
    background: rgba(0,201,167,0.08);
    border-color: rgba(0,201,167,0.3);
    transform: translate(0, -50%) scale(1.04);
  }

  .ring-attention {
    width: 14%;
    aspect-ratio: 1;
    top: 50%;
    left: 8%;
    transform: translate(0, -50%);
    background: rgba(0,201,167,0.08);
    border: 1px solid rgba(0,201,167,0.2);
    animation: pulse-attention 4s ease-in-out infinite;
  }
  .ring-attention:hover {
    background: rgba(0,201,167,0.15);
    border-color: var(--accent);
    transform: translate(0, -50%) scale(1.05);
  }

  @keyframes pulse-attention {
    0%, 100% { border-color: rgba(0,201,167,0.2); }
    50% { border-color: rgba(0,201,167,0.35); }
  }

  /* Ring labels */

  .ring-label {
    position: absolute;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    color: var(--white);
    white-space: nowrap;
    pointer-events: none;
    text-align: center;
    line-height: 1.4;
    text-shadow: 0 0 15px rgba(0,255,204,0.3);
    transition: text-shadow 0.3s, font-size 0.3s;
  }

  .ring-label-center {
    font-size: 16px;
    font-weight: 500;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    letter-spacing: 0.05em;
  }

  .ring:hover .ring-label { text-shadow: 0 0 30px rgba(0,255,204,0.5); font-size: 15px; }

  .ring-label-top {
    font-size: 13px;
    top: 10%;
    left: 50%;
    transform: translate(-50%, 0);
  }

  .ring-label-top-meaning {
    font-size: 13px;
    top: 4%;
    left: 50%;
    transform: translate(-50%, 0);
  }

  .ring-label-bottom {
    font-size: 13px;
    bottom: 12%;
    left: 50%;
    transform: translate(-50%, 0);
  }

  /* Right side: cycle diagram */
  .cycle-wrap {
    position: absolute;
    right: 2%;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 28%;
  }

  .cycle-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--dim);
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }

  .cycle-label:hover { color: var(--white); }

  .cycle-friction {
    font-size: 15px;
    letter-spacing: 0.15em;
    font-weight: 400;
  }

  .cycle-arrow-up {
    font-size: 16px;
    color: var(--dimmer);
    line-height: 1;
  }

  .cycle-circle {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    color: var(--dim);
  }

  .cycle-inner-label {
    position: absolute;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--dim);
    cursor: pointer;
    text-align: center;
    transition: color 0.3s;
    line-height: 1.3;
  }

  .cycle-inner-label:hover { color: var(--white); }

  .cycle-experimental {
    top: 12%;
    left: 50%;
    transform: translateX(-70%);
  }

  .cycle-relational {
    top: 42%;
    left: 50%;
    transform: translateX(-50%);
  }

  .cycle-pattern {
    bottom: 5%;
    left: 15%;
  }

  /* Connector lines */

  /* Detail panel */
  .detail-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--dimmer);
    padding: 24px 32px;
    transform: translateY(100%);
    transition: transform 0.4s ease;
    z-index: 200;
    max-height: 50vh;
    overflow-y: auto;
  }

  .detail-panel.open { transform: translateY(0); }

  .detail-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 300;
    color: var(--white);
    margin-bottom: 8px;
  }

  .detail-desc {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--dim);
    line-height: 1.7;
    margin-bottom: 12px;
  }

  .detail-link {
    font-size: 13px;
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 0.5px;
    text-underline-offset: 4px;
  }

  .detail-close {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 20px;
    color: var(--dim);
    cursor: pointer;
    background: none;
    border: none;
  }

  @media (max-width: 768px) {
    .diagram { aspect-ratio: 1; }
    .label, .side-label { font-size: 12px; }
    .ring-meaning { width: 70%; left: 5%; }
    .ring-perspective { width: 52%; left: 14%; }
    .ring-body { width: 34%; left: 23%; }
    .ring-attention { width: 18%; left: 31%; }
    .label-attention { left: 31%; transform: translate(calc(9vw - 50%), -50%); }
    .label-body { left: 25%; top: 70%; }
    .label-perspective { left: 16%; top: 24%; }
    .label-meaning { left: 8%; top: 10%; }
    .label-meaning-sub { left: 8%; top: 14%; }
    .cycle-wrap { width: 40%; right: 0; }
  }
</style>
</head>
<body>

<div class="bg-fixed"></div>


<div class="program-wrap">
  <div class="diagram">
    <!-- Rings with labels inside -->
    <div class="ring ring-meaning" onclick="showDetail('meaning')">
      <span class="ring-label ring-label-top-meaning">Meaning-making<br><span style="font-size:0.85em; opacity:0.6;">(the larger why)</span></span>
    </div>
    <div class="ring ring-perspective" onclick="showDetail('perspective')">
      <span class="ring-label ring-label-top">Perspective flexibility</span>
    </div>
    <div class="ring ring-body" onclick="showDetail('body')">
      <span class="ring-label ring-label-bottom">Body</span>
    </div>
    <div class="ring ring-attention" onclick="showDetail('attention')">
      <span class="ring-label ring-label-center">Attention</span>
    </div>

    <!-- Right side: cycle diagram -->
    <div class="cycle-wrap">
      <div class="cycle-label cycle-acceptance" onclick="showDetail('acceptance')">Acceptance</div>
      <div class="cycle-arrow-up">↑</div>
      <div class="cycle-label cycle-friction" onclick="showDetail('friction')">F R I C T I O N</div>
      <div class="cycle-arrow-up">↑</div>

      <div class="cycle-circle">
        <svg viewBox="0 0 200 200" style="width:100%; height:100%;">
          <!-- Open circle with arrows -->
          <path d="M 100 185 A 85 85 0 1 1 170 140" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
          <!-- Arrow at top right -->
          <polygon points="168,135 175,143 163,143" fill="currentColor" opacity="0.4"/>
          <!-- Arrow at bottom left -->
          <polygon points="32,140 25,132 37,132" fill="currentColor" opacity="0.4"/>
        </svg>

        <div class="cycle-inner-label cycle-experimental" onclick="showDetail('experimental')">Experimental<br>practice</div>
        <div class="cycle-inner-label cycle-relational" onclick="showDetail('relational')">Relational<br>contact</div>
        <div class="cycle-inner-label cycle-pattern" onclick="showDetail('pattern')">Pattern<br>awareness</div>
      </div>
    </div>
  </div>
</div>

<!-- Detail panel -->
<div class="detail-panel" id="detailPanel">
  <button class="detail-close" onclick="closeDetail()">✕</button>
  <div class="detail-title" id="detailTitle"></div>
  <div class="detail-desc" id="detailDesc"></div>
  <a class="detail-link" id="detailLink" href="#" style="display:none;"></a>
</div>

<script>
window.skipToolbar = true;
window.skipTheme = true;
// Force service worker to update
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(r) { r.update(); });
  });
}
</script>
<script src="shared.js"></script>
<script src="menu.js"></script>
<script>
var details = {
  attention: {
    title: 'Attention',
    desc: 'The center of everything. Where your focus goes, energy follows. Before you can change anything, you need to notice where your attention actually lives — not where you think it should be.',
    link: 'test-meta',
    linkText: '→ Take the Meta-Observation test'
  },
  body: {
    title: 'Body',
    desc: 'Your body holds what your mind avoids. Tension, shutdown, restlessness — these aren\'t problems. They\'re information. Learning to read your body is learning to read the truth of your situation.',
    link: 'yourmap',
    linkText: '→ Explore your map'
  },
  perspective: {
    title: 'Perspective Flexibility',
    desc: 'Can you see the same situation from a different angle? Rigidity keeps you stuck. Flexibility creates options. This isn\'t about being "open-minded" — it\'s about being able to genuinely occupy a perspective that isn\'t your default.',
    link: '/',
    linkText: '→ Read perspectives'
  },
  meaning: {
    title: 'Meaning-Making',
    desc: 'The story you tell about why things happen. This is the outermost layer — the narrative that either traps you or frees you. When you can see that your meaning is constructed, you can begin to construct differently.',
    link: null,
    linkText: ''
  },
  experimental: {
    title: 'Experimental Practice',
    desc: 'Change doesn\'t come from understanding. It comes from trying something different and surviving it. Small experiments — doing one thing you normally avoid, saying one thing you normally suppress — build the evidence your system needs.',
    link: null,
    linkText: ''
  },
  relational: {
    title: 'Relational Contact',
    desc: 'You can\'t see your own patterns alone. Another person — awake, present, honest — becomes a mirror. Not to fix you. To witness you. That witnessing changes what\'s possible.',
    link: 'collaborate',
    linkText: '→ Work with me'
  },
  pattern: {
    title: 'Pattern Awareness',
    desc: 'The ability to see your own loops as they\'re running. Not after. Not in theory. In real time. This is the skill that makes everything else possible.',
    link: 'awareness',
    linkText: '→ Presence & Intention'
  },
  friction: {
    title: 'Friction',
    desc: 'The resistance you feel when change gets real. Your system pushes back — not because you\'re doing it wrong, but because you\'re threatening what kept you safe. Friction isn\'t the enemy. It\'s the signal that you\'re at the edge of growth.',
    link: null,
    linkText: ''
  },
  acceptance: {
    title: 'Acceptance',
    desc: 'Not giving up. Not settling. Seeing what is — fully, without needing it to be different — so you can choose from clarity instead of reactivity. Acceptance is the ground that makes real change possible.',
    link: null,
    linkText: ''
  }
};

function showDetail(key) {
  var d = details[key];
  document.getElementById('detailTitle').textContent = d.title;
  document.getElementById('detailDesc').textContent = d.desc;
  var link = document.getElementById('detailLink');
  if (d.link) {
    link.href = d.link;
    link.textContent = d.linkText;
    link.style.display = '';
  } else {
    link.style.display = 'none';
  }
  document.getElementById('detailPanel').classList.add('open');

  // Highlight active
  document.querySelectorAll('.label, .side-label').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.ring').forEach(function(el) { el.style.borderColor = ''; el.style.background = ''; });
  var labels = document.querySelectorAll('.label-' + key + ', .label-' + key + '-sub');
  labels.forEach(function(el) { el.classList.add('active'); });
  var ring = document.querySelector('.ring-' + key);
  if (ring) { ring.style.borderColor = 'var(--accent)'; ring.style.background = 'rgba(0,201,167,0.04)'; }
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  document.querySelectorAll('.label, .side-label').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.ring').forEach(function(el) { el.style.borderColor = ''; el.style.background = ''; });
}

// ── COLOR RANDOMIZER ──
var diagramThemes = [
  // Dark black — neon teal
  { bg: '#0a0a0a', text: '#ffffff', ring: '#00ffcc', ringBg: ['none','none','#00ffcc35','#00ffcc50'], border: ['#00ffcc44','#00ffcc66','#00ffcc88','#00ffccbb'] },
  // Warm cream — deep burgundy
  { bg: '#f5f0e6', text: '#2a1520', ring: '#8c1c4a', ringBg: ['none','none','#8c1c4a28','#8c1c4a45'], border: ['#8c1c4a30','#8c1c4a50','#8c1c4a70','#8c1c4a99'] },
  // Deep navy — electric coral
  { bg: '#0d1b2a', text: '#e0f0ff', ring: '#ff6b6b', ringBg: ['none','none','#ff6b6b30','#ff6b6b4a'], border: ['#ff6b6b40','#ff6b6b60','#ff6b6b85','#ff6b6baa'] },
  // Sage green — warm amber
  { bg: '#e8ede4', text: '#1a2818', ring: '#c47d15', ringBg: ['none','none','#c47d1528','#c47d1545'], border: ['#c47d1530','#c47d1550','#c47d1575','#c47d15aa'] },
  // Midnight purple — gold
  { bg: '#12081f', text: '#f0e8d0', ring: '#ffc640', ringBg: ['none','none','#ffc64030','#ffc64050'], border: ['#ffc64040','#ffc64060','#ffc64088','#ffc640bb'] },
];
var currentDiagramColor = parseInt(localStorage.getItem('yam_program_theme') || '0');

function randomizeDiagramColor() {
  var t = diagramThemes[currentDiagramColor];
  var c = t.ring;

  // Background
  document.body.style.background = t.bg;
  document.querySelector('.bg-fixed').style.background = t.bg;

  // Ring fills and borders — each ring gets stronger toward center
  var rings = ['meaning','perspective','body','attention'];
  rings.forEach(function(name, i) {
    var ring = document.querySelector('.ring-' + name);
    ring.style.background = i < 2 ? 'none' : t.ringBg[i];
    ring.style.borderColor = t.border[i];
    ring.style.boxShadow = i < 2 ? 'none' : '0 0 ' + (20 + i*10) + 'px ' + c + (10 + i*8).toString(16).padStart(2,'0') + ' inset';
  });

  // Text — bright and popping
  document.querySelectorAll('.ring-label').forEach(function(el) {
    el.style.color = t.text;
    el.style.textShadow = '0 0 20px ' + c + '40';
  });
  document.querySelectorAll('.cycle-label, .cycle-inner-label').forEach(function(el) {
    el.style.color = t.text;
  });
  document.querySelectorAll('.cycle-arrow-up').forEach(function(el) {
    el.style.color = c;
  });
  document.querySelector('.cycle-circle').style.color = c;

  // Connectors
  document.querySelectorAll('.connector').forEach(function(el) {
    el.style.background = 'linear-gradient(to right, ' + c + '20, ' + c + '60)';
  });

  // Arrows
  document.querySelectorAll('.arrow').forEach(function(el) { el.style.color = c; });

  // Detail panel
  document.querySelector('.detail-panel').style.background = t.bg;
  document.querySelector('.detail-panel').style.borderColor = c + '44';
  document.querySelector('.detail-title').style.color = c;

}

function prevTheme() {
  currentDiagramColor = (currentDiagramColor - 1 + diagramThemes.length) % diagramThemes.length;
  applyDiagramTheme();
}

function nextTheme() {
  currentDiagramColor = (currentDiagramColor + 1) % diagramThemes.length;
  applyDiagramTheme();
}

function applyDiagramTheme() {
  localStorage.setItem('yam_program_theme', currentDiagramColor);
  randomizeDiagramColor();
}


// Color palette toggle
var paletteBtn = document.createElement('button');
paletteBtn.textContent = '🎨';
paletteBtn.style.cssText = 'position:fixed; left:20px; top:50%; transform:translateY(-50%); z-index:101; width:44px; height:44px; border-radius:50%; border:1px solid var(--dimmer); background:none; font-size:22px; cursor:pointer; transition:all 0.2s;';
paletteBtn.onmouseenter = function() { this.style.transform = 'translateY(-50%) scale(1.1)'; };
paletteBtn.onmouseleave = function() { this.style.transform = 'translateY(-50%)'; };
document.body.appendChild(paletteBtn);

var palette = document.createElement('div');
palette.style.cssText = 'position:fixed; left:20px; top:50%; transform:translateY(-50%); z-index:100; display:none; flex-direction:column; gap:8px; padding:12px; background:rgba(0,0,0,0.6); border-radius:24px; backdrop-filter:blur(8px);';

diagramThemes.forEach(function(t, i) {
  var swatch = document.createElement('button');
  swatch.style.cssText = 'width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:all 0.2s; background:' + t.ring + '; box-shadow:0 0 8px ' + t.ring + '40;';
  if (i === 0) swatch.style.borderColor = '#fff';
  swatch.onclick = function(e) {
    e.stopPropagation();
    currentDiagramColor = i;
    applyDiagramTheme();
    palette.querySelectorAll('button').forEach(function(b) { b.style.borderColor = 'transparent'; });
    swatch.style.borderColor = '#fff';
  };
  swatch.onmouseenter = function() { this.style.transform = 'scale(1.2)'; };
  swatch.onmouseleave = function() { this.style.transform = 'scale(1)'; };
  palette.appendChild(swatch);
});

// Font randomizer
var fonts = [
  "'DM Sans', sans-serif",
  "'Cormorant Garamond', serif",
  "'Georgia', serif",
  "'Courier New', monospace",
  "'Helvetica Neue', sans-serif",
];
var currentFont = 0;
var fontBtn = document.createElement('button');
fontBtn.textContent = 'Aa';
fontBtn.style.cssText = 'width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); background:none; color:rgba(255,255,255,0.7); font-size:13px; cursor:pointer; transition:all 0.2s; font-family:serif;';
fontBtn.onmouseenter = function() { this.style.transform = 'scale(1.2)'; };
fontBtn.onmouseleave = function() { this.style.transform = 'scale(1)'; };
fontBtn.onclick = function(e) {
  e.stopPropagation();
  currentFont = (currentFont + 1) % fonts.length;
  document.querySelectorAll('.ring-label').forEach(function(el) {
    el.style.fontFamily = fonts[currentFont];
  });
  document.querySelectorAll('.side-label').forEach(function(el) {
    el.style.fontFamily = fonts[currentFont];
  });
};
palette.appendChild(fontBtn);

document.body.appendChild(palette);

paletteBtn.onclick = function(e) {
  e.stopPropagation();
  var isOpen = palette.style.display === 'flex';
  palette.style.display = isOpen ? 'none' : 'flex';
  paletteBtn.style.display = isOpen ? '' : 'none';
};

document.addEventListener('click', function() {
  palette.style.display = 'none';
  paletteBtn.style.display = '';
});

// Apply saved theme on load
applyDiagramTheme();
// Highlight active swatch
var swatches = palette.querySelectorAll('button:not(:last-child)');
if (swatches[currentDiagramColor]) swatches[currentDiagramColor].style.borderColor = '#fff';
</script>
</body>
</html>
