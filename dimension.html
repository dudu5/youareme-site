<!DOCTYPE html>
<html lang="en" style="background:#050508;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Are Me</title>
<link rel="icon" type="image/png" href="images/Logo/Logo-dark.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body { background: #050508; }

  .dim-wrap {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 10vh 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: radial-gradient(ellipse at 30% 40%, rgba(31,232,195,0.03) 0%, transparent 60%);
  }

  .dim-back {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    margin-bottom: 32px;
    display: inline-block;
    padding: 8px 12px;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .dim-back:hover { color: var(--white); transform: translateX(-4px); }

  .dim-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 300;
    color: var(--white);
    margin-bottom: 16px;
    letter-spacing: 0.02em;
    text-shadow: 0 0 40px rgba(31,232,195,0.15);
    opacity: 0;
    animation: dim-in 1s ease 0.2s forwards;
  }

  .dim-desc {
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 300;
    color: rgba(255,255,255,0.55);
    line-height: 1.8;
    margin-bottom: 40px;
    max-width: 520px;
    opacity: 0;
    animation: dim-in 1s ease 0.5s forwards;
  }

  .dim-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, rgba(31,232,195,0.3), transparent);
    margin-bottom: 32px;
    opacity: 0;
    animation: dim-in 1s ease 0.7s forwards;
  }

  .dim-content {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: rgba(255,255,255,0.35);
    line-height: 1.7;
    min-height: 100px;
    opacity: 0;
    animation: dim-in 1s ease 0.9s forwards;
  }

  @keyframes dim-in {
    from { opacity: 0; filter: blur(4px); transform: translateY(8px); }
    to { opacity: 1; filter: blur(0); transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .dim-wrap { padding: 8vh 24px; }
    .dim-title { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="bg-fixed" style="background:#050508;"></div>

<div class="dim-wrap">
  <a href="program" class="dim-back">← Back</a>
  <h1 class="dim-title" id="dimTitle"></h1>
  <p class="dim-desc" id="dimDesc"></p>
  <div class="dim-divider"></div>
  <div class="dim-content" id="dimContent">
    <p style="font-style:italic;">Coming soon...</p>
  </div>
</div>

<script>
var dimensions = {
  attention: {
    title: 'Attention',
    desc: 'The center of everything. Where your focus goes, energy follows. Before you can change anything, you need to notice where your attention actually lives — not where you think it should be.'
  },
  body: {
    title: 'Body',
    desc: 'Your body holds what your mind avoids. Tension, shutdown, restlessness — these aren\'t problems. They\'re information. Learning to read your body is learning to read the truth of your situation.'
  },
  perspective: {
    title: 'Perspective Flexibility',
    desc: 'Can you see the same situation from a different angle? Rigidity keeps you stuck. Flexibility creates options. This isn\'t about being "open-minded" — it\'s about being able to genuinely occupy a perspective that isn\'t your default.'
  },
  meaning: {
    title: 'Meaning-Making',
    desc: 'The story you tell about why things happen. This is the outermost layer — the narrative that either traps you or frees you. When you can see that your meaning is constructed, you can begin to construct differently.'
  },
  experimental: {
    title: 'Experimental Practice',
    desc: 'Change doesn\'t come from understanding. It comes from trying something different and surviving it. Small experiments — doing one thing you normally avoid, saying one thing you normally suppress — build the evidence your system needs.'
  },
  relational: {
    title: 'Relational Contact',
    desc: 'You can\'t see your own patterns alone. Another person — awake, present, honest — becomes a mirror. Not to fix you. To witness you. That witnessing changes what\'s possible.'
  },
  pattern: {
    title: 'Pattern Awareness',
    desc: 'The ability to see your own loops as they\'re running. Not after. Not in theory. In real time. This is the skill that makes everything else possible.'
  },
  friction: {
    title: 'Friction',
    desc: 'The resistance you feel when change gets real. Your system pushes back — not because you\'re doing it wrong, but because you\'re threatening what kept you safe. Friction isn\'t the enemy. It\'s the signal that you\'re at the edge of growth.'
  },
  acceptance: {
    title: 'Acceptance',
    desc: 'Not giving up. Not settling. Seeing what is — fully, without needing it to be different — so you can choose from clarity instead of reactivity. Acceptance is the ground that makes real change possible.'
  }
};

var params = new URLSearchParams(window.location.search);
var key = params.get('d') || 'attention';
var dim = dimensions[key];

if (dim) {
  document.getElementById('dimTitle').textContent = dim.title;
  document.getElementById('dimDesc').textContent = dim.desc;
  document.title = dim.title + ' — You Are Me';
}

// Apply same color theme as program page
var programThemes = [
  { bg: '#0a0a0a', text: '#ffffff', ring: '#00ffcc' },
  { bg: '#f5f0e6', text: '#2a1520', ring: '#8c1c4a' },
  { bg: '#0d1b2a', text: '#e0f0ff', ring: '#ff6b6b' },
  { bg: '#e8ede4', text: '#1a2818', ring: '#c47d15' },
  { bg: '#12081f', text: '#f0e8d0', ring: '#ffc640' },
];
var themeIdx = parseInt(localStorage.getItem('yam_program_theme') || '0');
var t = programThemes[themeIdx];
if (t) {
  document.documentElement.style.background = t.bg;
  document.body.style.background = t.bg;
  document.querySelector('.bg-fixed').style.background = t.bg;
  document.querySelector('.dim-wrap').style.background = 'radial-gradient(ellipse at 30% 40%, ' + t.ring + '08, transparent 60%)';
  document.querySelector('.dim-title').style.color = t.text;
  document.querySelector('.dim-title').style.textShadow = '0 0 40px ' + t.ring + '25';
  document.querySelector('.dim-desc').style.color = t.text + '8c';
  document.querySelector('.dim-divider').style.background = 'linear-gradient(to right, ' + t.ring + '50, transparent)';
  document.querySelector('.dim-content').style.color = t.text + '55';
  document.querySelector('.dim-back').style.color = t.text + '66';
}
</script>
<script src="shared.js"></script>
</body>
</html>
